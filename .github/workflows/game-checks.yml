name: Card Game Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  same-database:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/harbor-campaign-calendar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run both game revisions in a disposable capped container
        run: |
          mkdir "$RUNNER_TEMP/review-output"
          sh scripts/build-half-cpu.sh --run --rm -e GOMAXPROCS=1 \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/review-output:/out" \
            golang:1.25-bookworm sh /src/docs/pr-3-evidence/harness/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-review
          path: ${{ runner.temp }}/review-output/
          if-no-files-found: error
  game-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source and preview boundaries
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/audit-release.py
      - name: Run game UI checks with the shared half-CPU quota
        run: >-
          sh scripts/build-half-cpu.sh --run --rm
          -v "$PWD:/workspace" -w /workspace node:24-bookworm-slim
          sh -c 'npm ci --ignore-scripts && npm test'
